<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Дневник рутины</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#07080b; --panel:#0c0e12; --raise:#11141a; --line:#181c23; --line2:#232832;
  --text:#c9ced6; --mute:#5a616b; --dim:#2a2f38;
  --acc:#f0c419; --acc-rgb:240,196,25;
  --name-w:230px; --pct-w:58px; --cell:28px;
  --display:'Avenir Next Condensed','Futura','Helvetica Neue',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; min-height:100vh; color:var(--text); font:14px/1.4 var(--body);
  background:
    radial-gradient(900px 380px at 50% -140px, rgba(var(--acc-rgb),.07), transparent 70%),
    var(--bg);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1400px;margin:0 auto;padding:28px 28px 40px}

/* header */
.top{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font:600 26px/1 var(--display);letter-spacing:.14em;color:#e8ebef;text-transform:uppercase}
h1 span{color:var(--acc);text-shadow:0 0 14px rgba(var(--acc-rgb),.55)}
.months{display:flex;align-items:center;gap:6px;margin-left:8px}
#mlabel{min-width:150px;text-align:center;font:500 18px var(--display);letter-spacing:.06em}
.sq{width:34px;height:34px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;color:var(--text);font-size:18px;line-height:1}
.sq:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.sq:disabled{opacity:.3;cursor:default}
.spacer{flex:1}
.btn{height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);color:var(--text)}
.btn:hover{border-color:#3a414d;background:var(--raise)}
.neon{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.05);
  box-shadow:0 0 14px rgba(var(--acc-rgb),.22), inset 0 0 10px rgba(var(--acc-rgb),.07);transition:box-shadow .15s}
.neon:hover{background:rgba(var(--acc-rgb),.1);border-color:var(--acc);box-shadow:0 0 22px rgba(var(--acc-rgb),.4), inset 0 0 12px rgba(var(--acc-rgb),.12)}

/* summary */
.summary{display:flex;align-items:stretch;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.total{padding:10px 18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:132px}
.total b{display:block;font:600 34px/1.05 var(--display);color:#f1f3f6;letter-spacing:.02em}
.total small{color:var(--mute);font-size:12px}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.tagbtn{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:8px 14px;min-width:104px;text-align:left;
  border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.tagbtn b{font:600 22px/1.1 var(--display);color:#dfe3e8}
.tagbtn small{color:var(--mute);font-size:12px}
.tagbtn:hover{border-color:var(--line2)}
.tagbtn.on{border-color:var(--acc);box-shadow:0 0 12px rgba(var(--acc-rgb),.18)}
.tagbtn.on small{color:var(--acc)}

/* grid */
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:calc(100vh - 260px);min-height:220px}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{padding:0;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;z-index:4;background:var(--panel);height:44px;border-bottom:1px solid var(--line2);font-weight:400}
.name{position:sticky;left:0;z-index:3;background:var(--panel);text-align:left;padding:7px 12px 7px 14px;cursor:pointer}
.pct{position:sticky;left:var(--name-w);z-index:3;background:var(--panel);text-align:right;padding-right:12px;
  border-right:1px solid var(--line2);font:600 15px var(--display);color:#dfe3e8}
thead .name,thead .pct{z-index:5}
tbody tr:hover .name,tbody tr:hover .pct{background:var(--raise)}
tbody tr:hover td.c{background-color:rgba(255,255,255,.012)}
.name .n{display:block;color:#e4e7ec;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .s{display:block;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .s i{font-style:normal;color:#7b838e}
.pct.low{color:#8d96a1}
.pct small{display:block;font:400 10.5px var(--body);color:var(--mute)}

th.d{width:var(--cell);text-align:center;color:var(--mute);line-height:1.15}
th.d i{display:block;font-style:normal;font-size:10.5px}
th.d b{display:block;font-weight:500;font-size:12.5px;color:#9aa1ab}
th.d.we i,th.d.we b{color:#6b5f3a}
th.d.today{box-shadow:inset 0 -2px 0 var(--acc)}
th.d.today b{color:var(--acc)}
th.mon,td.mon{border-left:1px solid var(--line2)}

tr.sec td{height:26px;padding:0 14px;background:#0a0c0f;color:var(--mute);font-size:12px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
tr.sec td{position:sticky;left:0}

td.c{width:var(--cell);height:var(--cell);text-align:center;font-size:10.5px;color:#7f8791;cursor:pointer;position:relative;user-select:none}
td.c::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border:1px solid var(--dim);border-radius:5px;transition:background .12s,box-shadow .12s,border-color .12s}
td.c span{position:relative;z-index:1}
td.c:hover::after{border-color:#4a525e}
td.c.done::after{background:var(--acc);border-color:var(--acc);box-shadow:0 0 9px rgba(var(--acc-rgb),.5)}
td.c.done{color:#15120a;font-weight:700}
td.c.part::after{border-color:rgba(var(--acc-rgb),.55);background:linear-gradient(to top, rgba(var(--acc-rgb),.38) calc(var(--p)*100%), transparent 0)}
td.c.part{color:#e9d27a}
td.c.off::after{border-style:dashed;border-color:#1c2027}
td.c.off{color:#3b414a}
td.c.off.done::after{opacity:.55;box-shadow:none}
td.c.fut{cursor:default}
td.c.fut::after{border-color:#14171c}
td.c.fut:hover::after{border-color:#14171c}
td.c.today:not(.done)::after{border-color:rgba(var(--acc-rgb),.6)}
td.c.m::after{border-color:transparent;background:rgba(var(--acc-rgb),calc(var(--i)*.5));}
td.c.m.empty::after{border-color:var(--dim);background:transparent}
td.c.m{color:#f4e7b0}
td.c.m.fut::after{border-color:#14171c}

.empty-note{padding:36px 20px;color:var(--mute);text-align:center}
.empty-note b{color:var(--text);display:block;margin-bottom:4px}
footer{margin-top:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:12.5px}
footer .warn{color:#c9a227}
footer button{background:none;border:0;color:#8a929d;padding:0;text-decoration:underline;text-underline-offset:3px}
footer button:hover{color:var(--acc)}

/* popover */
#pop{position:absolute;z-index:50;width:232px;padding:12px;border:1px solid var(--line2);border-radius:10px;background:#0d1015;
  box-shadow:0 18px 50px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.6);display:none}
#pop.open{display:block}
#pop h4{margin:0 0 10px;font:500 13px var(--body);color:#aeb5bf}
#pop h4 em{font-style:normal;color:var(--mute)}
.prow{display:flex;gap:6px;margin-top:8px}
.prow input{flex:1;min-width:0;height:34px;text-align:center;font-size:16px;background:var(--bg);border:1px solid var(--line2);border-radius:6px}
.prow input:focus{outline:none;border-color:var(--acc)}
.prow button{height:34px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:0 12px}
.prow button:hover{border-color:var(--acc);color:var(--acc)}
.prow .grow{flex:1}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:34px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;font-weight:500}
.scale button:hover,.scale button.cur{border-color:var(--acc);color:var(--acc)}
.scale button.cur{background:rgba(var(--acc-rgb),.1);box-shadow:0 0 10px rgba(var(--acc-rgb),.25)}

/* dialogs */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:0;width:min(440px,calc(100vw - 32px));
  box-shadow:0 30px 80px rgba(0,0,0,.8)}
dialog::backdrop{background:rgba(2,3,5,.78)}
dialog form{padding:22px}
dialog h2{margin:0 0 16px;font:600 20px var(--display);letter-spacing:.06em;color:#eceff3}
label.f{display:block;margin-bottom:14px}
label.f>span,.lbl{display:block;margin-bottom:6px;color:#8c949f;font-size:12.5px}
.in{width:100%;height:36px;padding:0 10px;background:var(--bg);border:1px solid var(--line2);border-radius:6px}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7b838e 50%),linear-gradient(135deg,#7b838e 50%,transparent 50%);
  background-position:calc(100% - 17px) 15px,calc(100% - 12px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{height:28px;padding:0 10px;border:1px solid var(--line2);background:var(--bg);border-radius:14px;font-size:12.5px;color:#9aa1ab}
.chip:hover{border-color:#3a414d}
.chip.on{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.08)}
.days{display:flex;gap:6px;margin-top:8px}
.days .chip{flex:1;padding:0;border-radius:6px;height:32px}
.hide{display:none!important}
.dact{display:flex;gap:8px;margin-top:20px;align-items:center}
.dact .btn.danger:hover{border-color:#8a3a3a;color:#e07a7a}
.hint{color:var(--mute);font-size:12px;margin-top:6px}

@media (max-width:820px){
  main{padding:16px 12px 28px}
  :root{--name-w:150px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Дневник <span>рутины</span></h1>
    <nav class="months" aria-label="Месяц">
      <button class="sq" id="prev" aria-label="Предыдущий месяц">‹</button>
      <div id="mlabel" aria-live="polite"></div>
      <button class="sq" id="next" aria-label="Следующий месяц">›</button>
      <button class="btn" id="today">Сегодня</button>
    </nav>
    <div class="spacer"></div>
    <button class="btn" id="addMetric">Добавить метрику</button>
    <button class="btn neon" id="addHabit">Добавить привычку</button>
  </header>

  <section class="summary" id="summary" aria-label="Итоги месяца"></section>

  <div class="scroll" id="scroll"><table id="grid"></table></div>

  <footer>
    <span id="saveInfo"></span>
    <button id="export">Экспорт</button>
    <button id="import">Импорт</button>
    <input type="file" id="file" accept="application/json,.json" class="hide">
  </footer>
</main>

<div id="pop" role="dialog" aria-label="Значение"></div>

<dialog id="hdlg">
  <form method="dialog" id="hform" novalidate>
    <h2 id="htitle">Привычка</h2>
    <label class="f"><span>Название</span><input class="in" id="hname" maxlength="60" autocomplete="off"></label>

    <label class="f"><span>Тип</span>
      <select class="in" id="htype">
        <option value="bool">Да / нет</option>
        <option value="num">Число с целью</option>
      </select>
    </label>

    <div id="numf" class="grid3 hide" style="margin-bottom:14px">
      <label><span class="lbl">Цель в день</span><input class="in" id="htarget" type="number" min="0.1" step="any" value="1"></label>
      <label><span class="lbl">Единица</span><input class="in" id="hunit" maxlength="8" placeholder="л, стр"></label>
      <label><span class="lbl">Шаг +/−</span><input class="in" id="hstep" type="number" min="0.1" step="any" value="1"></label>
    </div>

    <label class="f"><span>Расписание</span>
      <select class="in" id="hsched">
        <option value="daily">Каждый день</option>
        <option value="weekdays">По будням</option>
        <option value="custom">Выбранные дни</option>
        <option value="week">N раз в неделю, в любые дни</option>
      </select>
    </label>
    <div id="daysf" class="days hide" style="margin:-6px 0 14px"></div>
    <label class="f hide" id="weekf" style="margin-top:-6px"><span>Раз в неделю</span><input class="in" id="hweek" type="number" min="1" max="7" value="3"></label>

    <div class="f">
      <span class="lbl">Теги</span>
      <input class="in" id="htags" placeholder="Тело, Режим" autocomplete="off">
      <div class="chips" id="tagchips"></div>
    </div>

    <div class="dact">
      <button class="btn danger hide" id="hdel" type="button">Удалить</button>
      <button class="btn hide" id="harch" type="button">В архив</button>
      <div class="spacer"></div>
      <button class="btn" id="hcancel" type="button">Отмена</button>
      <button class="btn neon" id="hsave" type="submit" value="ok">Сохранить</button>
    </div>
    <div class="hint hide" id="harchhint">Архив убирает привычку со следующих дней. История за прошлые месяцы остаётся.</div>
  </form>
</dialog>

<dialog id="mdlg">
  <form method="dialog" id="mform" novalidate>
    <h2 id="mtitle">Метрика дня</h2>
    <label class="f"><span>Название</span><input class="in" id="mname" maxlength="40" autocomplete="off" placeholder="Например: Энергия"></label>
    <div class="hint" style="margin:-6px 0 0">Оценка по шкале от 1 до 10.</div>
    <div class="dact">
      <button class="btn danger hide" id="mdel" type="button">Удалить</button>
      <div class="spacer"></div>
      <button class="btn" id="mcancel" type="button">Отмена</button>
      <button class="btn neon" type="submit" value="ok">Сохранить</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
